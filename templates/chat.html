<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Challenge Navigator</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .thinking-dots {
            display: none;
            text-align: center;
            font-size: 1.1rem;
            color: #007bff;
            margin-top: 10px;
        }

        .thinking-dots span {
            animation: blink 1.5s infinite;
        }

        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .suggestion-btn {
            cursor: pointer;
        }

        #suggestionBox {
            display: flex;
            flex-wrap: wrap;
        }

        .config-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }

        .config-box h5 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
<div class="container-fluid h-100">
    <div class="row justify-content-center h-100">
        <div class="col-md-8 col-xl-6 chat">
            <div class="card">
                <div class="card-header msg_head">
                    <div class="d-flex bd-highlight">
                        <div class="img_cont">
                            <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img">
                            <span class="online_icon"></span>
                        </div>
                        <div class="user_info">
                            <span>Challenge Navigator</span>
                            <p>Customize your AI assistant</p>
                        </div>
                    </div>
                </div>

                <div class="card-body msg_card_body">
                    <!-- 🔧 LLM Selection -->
                    <div class="config-box">
                        <h5>Choose Your LLM</h5>
                        <div class="form-group">
                            <select id="llmSelector" class="form-control" disabled>
                                <option selected>LLaMA (Local - Default)</option>
                            </select>
                            <small class="text-muted">Switching LLM coming soon</small>
                        </div>
                    </div>

                    <!-- 💬 Message area -->
                    <div id="messageFormeight"></div>
                </div>

                <div class="card-footer">
                    <!-- Suggestions -->
                    <div id="suggestionBox" class="mb-2"></div>

                    <!-- Input Form -->
                    <form id="messageArea" class="input-group">
                        <input type="text" id="text" name="msg" placeholder="Describe your challenge..." autocomplete="off" class="form-control type_msg" required />
                        <div class="input-group-append">
                            <button type="submit" id="send" class="input-group-text send_btn">
                                <i class="fas fa-location-arrow"></i>
                            </button>
                        </div>
                    </form>

                    <!-- Thinking Animation -->
                    <div id="thinkingIndicator" class="thinking-dots">
                        Thinking<span>.</span><span>.</span><span>.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {
    // ✅ Suggestion Logic
    $("#text").on("input", function () {
        const input = $(this).val();
        if (input.length < 3) {
            $("#suggestionBox").empty();
            return;
        }

        $.post("/suggest", { msg: input }, function (data) {
            const suggestions = data.suggestions || [];
            const html = suggestions.map(s =>
                `<button type="button" class="btn btn-sm btn-outline-secondary m-1 suggestion-btn">${s}</button>`
            ).join("");
            $("#suggestionBox").html(html);
        });
    });

    // ✅ Use Suggestion
    $(document).on("click", ".suggestion-btn", function () {
        $("#text").val($(this).text()).focus();
    });

    // ✅ Submit User Message
    $("#messageArea").on("submit", async function (e) {
        e.preventDefault();
        const userText = $("#text").val();
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const userHtml = `
            <div class="d-flex justify-content-end mb-4">
                <div class="msg_cotainer_send">${userText}<span class="msg_time_send">${time}</span></div>
                <div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg"></div>
            </div>`;
        $("#messageFormeight").append(userHtml);
        $("#text").val("");
        $("#thinkingIndicator").show();

        const res = await fetch("/get", {
            method: "POST",
            body: new URLSearchParams({ msg: userText })
        });

        const data = await res.json();
        const reply = data.answer || "[No answer]";

        const botHtml = `
            <div class="d-flex justify-content-start mb-4">
                <div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg"></div>
                <div class="msg_cotainer">${reply}<span class="msg_time">${time}</span></div>
            </div>`;

        $("#messageFormeight").append($.parseHTML(botHtml));
        $("#thinkingIndicator").hide();
        $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
    });
});
</script>
</body>
</html>
