<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Develop — Challenge Navigator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center text-success fw-bold">Develop</h2>
  <p class="text-center">Create a solution prototype from your selected ideas</p>

  <h5>Selected Ideas:</h5>
  <ul>
    {% for idea in selected_ideas %}
      <li>{{ idea }}</li>
    {% endfor %}
  </ul>

  <form method="POST" action="/prototype">
    {% for idea in selected_ideas %}
      <input type="hidden" name="selected_ideas" value="{{ idea }}">
    {% endfor %}
    <button class="btn btn-primary mt-3" type="submit">Generate Prototype</button>
  </form>
</div>

</body>
</html>
