<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clarify — Challenge Navigator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <h2 class="text-center text-primary fw-bold">Clarify</h2>
  <p class="text-center">Understand the challenge</p>

  <form method="POST" action="/generate_challenges">
    <div class="mb-3">
      <label class="form-label fw-bold">🎯 Goal</label>
      <input type="text" class="form-control" name="goal" placeholder="It would be great if..." required>
    </div>

    <button class="btn btn-primary" type="submit">Generate Challenges</button>
  </form>

  {% if challenges %}
    <hr>
    <form method="POST" action="/ideate">
      <h5 class="mt-4">🧩 Choose a challenge:</h5>
      {% for challenge in challenges %}
        <div class="form-check">
          <input class="form-check-input" type="radio" name="selected_challenge" value="{{ challenge }}" required>
          <label class="form-check-label">{{ challenge }}</label>
        </div>
      {% endfor %}
      <button class="btn btn-success mt-3" type="submit">Next: Ideate</button>
    </form>
  {% endif %}
</div>

</body>
</html>
