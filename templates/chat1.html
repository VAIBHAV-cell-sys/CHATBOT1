<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot AI</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #chat-container {
            background-color: #fff;
            width: 420px;
            max-width: 95%;
            height: 90vh;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* Header */
        #chat-header {
            background: #4A90E2;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Chat box */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #f7f9fc;
        }

        /* Chat bubbles */
        .chat-message {
            max-width: 80%;
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 12px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user-msg {
            background: #4A90E2;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .bot-msg {
            background: #e5e5ea;
            color: #000;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        /* Input area */
        #input-area {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        #user-input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        #send-btn {
            background: #4A90E2;
            color: white;
        }
        #send-btn:hover { background: #357ABD; }

        #generate-challenges-btn, #generate-plan-btn {
            background: #50C878;
            color: white;
            font-size: 12px;
            margin-top: 5px;
        }
        #generate-challenges-btn:hover, #generate-plan-btn:hover {
            background: #3fa567;
        }

        /* Model selector */
        #model-select {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            background: #f9f9f9;
        }

        select, input {
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 13px;
        }

        #challenges-list {
            padding: 10px;
            font-size: 14px;
        }

        /* Smooth fade animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div id="chat-container">
    <div id="chat-header">🤖 Chatbot AI</div>

    <div id="model-select">
        <label for="model">Model:</label>
        <select id="model">
            <option value="openai">OpenAI</option>
            <option value="perplexity">Perplexity AI</option>
            <option value="deepseek">DeepSeek AI</option>
            <option value="aimlapi">AIMLAPI</option>
        </select>
        <input type="text" id="api_key" placeholder="API Key (if needed)" />
        <button id="set-model-btn">Set</button>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." />
        <button id="send-btn">Send</button>
    </div>

    <div style="padding:10px; text-align:center;">
        <button id="generate-challenges-btn">⚡ Generate Challenges</button>
        <button id="generate-plan-btn">📋 Generate Plan</button>
    </div>

    <div id="challenges-list"></div>
</div>

<script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const modelSelect = document.getElementById("model");
    const apiKeyInput = document.getElementById("api_key");
    const setModelBtn = document.getElementById("set-model-btn");
    const generateChallengesBtn = document.getElementById("generate-challenges-btn");
    const generatePlanBtn = document.getElementById("generate-plan-btn");
    const challengesListDiv = document.getElementById("challenges-list");

    let challenges = [];

    function appendMessage(message, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("chat-message", sender === "user" ? "user-msg" : "bot-msg");
        msgDiv.innerText = message;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener("click", async () => {
        const msg = userInput.value.trim();
        if (!msg) return;
        appendMessage(msg, "user");
        userInput.value = "";

        const res = await fetch("/get", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `msg=${encodeURIComponent(msg)}`
        });
        const data = await res.json();
        appendMessage(data.answer, "bot");
    });

    setModelBtn.addEventListener("click", async () => {
        const model = modelSelect.value;
        const api_key = apiKeyInput.value;
        await fetch("/set_model", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `model=${encodeURIComponent(model)}&api_key=${encodeURIComponent(api_key)}`
        });
        alert("Model updated!");
    });

    generateChallengesBtn.addEventListener("click", async () => {
        const goal = userInput.value.trim();
        if (!goal) return alert("Enter your goal first!");

        const res = await fetch("/generate_challenges", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `goal=${encodeURIComponent(goal)}`
        });
        const data = await res.json();
        challenges = data.challenges;
        challengesListDiv.innerHTML = "<h4>Challenges:</h4>" + challenges.map(c => `<div>- ${c}</div>`).join("");
    });

    generatePlanBtn.addEventListener("click", async () => {
        if (challenges.length === 0) return alert("Generate challenges first!");
        const formData = new URLSearchParams();
        challenges.forEach(c => formData.append("challenges[]", c));

        const res = await fetch("/generate_plan", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        });
        const data = await res.json();
        appendMessage(data.plan, "bot");
    });
</script>
</body>
</html>
