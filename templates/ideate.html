<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ideate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
    }
    h1 {
      color: #f4a300;
      text-align: center;
    }
    .challenge-list {
      max-width: 600px;
      margin: 30px auto;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px;
      font-size: 16px;
      background-color: #f4a300;
      border: none;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Ideate</h1>
  <p style="text-align: center;">Generate ideas for the selected challenge</p>

  <div class="challenge-list">
  <form method="POST" action="/generate_ideas">
  {% for challenge in challenges %}
    <div>
      <input type="radio" name="challenge" value="{{ challenge }}" id="challenge{{ loop.index }}" required>
      <label for="challenge{{ loop.index }}">{{ challenge }}</label>
    </div>
  {% endfor %}
  
  <button type="submit" style="margin-top: 20px;">Generate Ideas</button>
</form>

  </div>
</body>
</html>
